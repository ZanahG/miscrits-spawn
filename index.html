<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Miscrits HUB</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="./assets/images/logo.png" sizes="32x32">
  <link rel="apple-touch-icon" href="./assets/images/logo.png">
</head>
<body>
  <header class="siteHeader">
    <div class="wrap siteHeader__inner">
      <a class="brand" href="./index.html" aria-label="Ir a Miscrits Hub">
        <img
          src="./assets/images/logo.png"
          alt="Miscrits Hub"
          class="brand__logo"
          draggable="false"
        />
      </a>

      <button
        class="navToggle"
        id="navToggle"
        type="button"
        aria-label="Abrir menú"
        aria-controls="mainNav"
        aria-expanded="false"
      >
        <img class="navToggle__icon" src="./assets/images/icons/menu.png" alt="" />
      </button>

      <nav id="mainNav" class="siteNav" aria-label="Navegación principal">
        <a class="siteNav__link is-active" href="./index.html">Spawns</a>
        <a class="siteNav__link" href="./html/miscripedia.html">Miscripedia</a>
        <a class="siteNav__link" href="./html/breeding.html">Breeding Calculator</a>
        <a class="siteNav__link" href="./html/statscalculator.html">Stats Calculator</a>
        <a class="siteNav__link" href="./html/pvp.html">PVP Teams</a>
        <a class="siteNav__link" href="./html/teambuilder.html">Team Builder</a>
        <a class="siteNav__link" href="./html/damage.html">Damage Calculator</a>
        <a class="siteNav__link" href="./html/miscritdle.html">Miscritdle</a>
        <a class="siteNav__link" href="./html/patchs.html">Patch Notes</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="filters card">
      <div class="field">
        <label for="q">Search Miscrit</label>
        <input id="q" type="text" placeholder="Ex: Flue" autocomplete="off" />
      </div>

      <div class="field">
        <label for="day">Day</label>
        <select id="day" class="day-select">
          <option value="__today__">🔥 TODAY 🔥</option>
          <option value="">All days</option>
          <option value="Lunes">Monday</option>
          <option value="Martes">Tuesday</option>
          <option value="Miércoles">Wednesday</option>
          <option value="Jueves">Thursday</option>
          <option value="Viernes">Friday</option>
          <option value="Sábado">Saturday</option>
          <option value="Domingo">Sunday</option>
        </select>
      </div>

      <div class="field">
        <label for="place">Spawn Place</label>
        <select id="place">
          <option value="">All</option>
          <option value="Volcano Island">Volcano Island</option>
          <option value="Forest">Forest</option>
          <option value="Mount Gemma">Mount Gemma</option>
          <option value="The Shac">The Shac</option>
          <option value="Mansion">Mansion</option>
          <option value="Beach">Shore</option>
          <option value="Moon of Miscria">Moon of Miscria</option>
          <option value="Cave">Cave</option>
        </select>
      </div>

      <div class="field">
        <label for="element">Element</label>
        <select id="element">
          <option value="">All</option>
          <option value="fire">Fire</option>
          <option value="water">Water</option>
          <option value="nature">Nature</option>
          <option value="earth">Earth</option>
          <option value="wind">Wind</option>
          <option value="lightning">Lightning</option>
        </select>
      </div>

      <div class="field">
        <label for="rarity">Rarity</label>
        <select id="rarity">
          <option value="">All</option>
          <option value="Common">Common</option>
          <option value="Rare">Rare</option>
          <option value="Epic">Epic</option>
          <option value="Exotic">Exotic</option>
          <option value="Legendary">Legendary</option>
        </select>
      </div>

      <div class="actions">
        <button id="btnClear" class="btn ghost">Clean Filters</button>
        <button id="btnRandom" class="btn">Random Miscrit</button>
      </div>
    </section>

    <section class="meta">
      <div id="count"></div>
    </section>

    <section id="results" class="grid"></section>

    <template id="miscritCard">
      <article class="miscrit card">
        <div class="miscrit__head">
          <div class="miscrit__left">
            <img class="miscrit__avatar" />
              <div>
                <h2 class="miscrit__name"></h2>
                <div class="miscrit__type"></div>
              </div>
          </div>
          <div class="badge"></div>
        </div>
        <div class="spawns"></div>
      </article>
    </template>
  </main>

  <footer class="footer">
    <section class="pager card" id="pager">
  		<button class="btn ghost" id="btnPrev">Previous</button>

  		<div class="pager__mid">
    		<span id="pageInfo">Page 1 / 1</span>

    		<label class="pager__label">
      		Per page
      		<select id="pageSize">
						<option value="24">24</option>
						<option value="36" selected>36</option>
						<option value="48">48</option>
						<option value="72">72</option>
      		</select>
    		</label>
  		</div>
			<button class="btn" id="btnNext">Next</button>
		</section>
  </footer>

  <script src="./js/app.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
