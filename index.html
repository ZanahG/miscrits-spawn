<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Miscrits Spawns Wiki</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Miscrits Spawn Wiki</h1>
      <p>Filtra por Miscrit y descubre qué día y dónde aparece.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="filters card">
      <div class="field">
        <label for="q">Buscar Miscrit</label>
        <input id="q" type="text" placeholder="Ej: Flue..." autocomplete="off" />
      </div>

      <div class="field">
        <label for="day">Día</label>
        <select id="day">
          <option value="">Todos</option>
          <option value="Lunes">Lunes</option>
          <option value="Martes">Martes</option>
          <option value="Miércoles">Miércoles</option>
          <option value="Jueves">Jueves</option>
          <option value="Viernes">Viernes</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
      </div>

      <div class="field today-field">
        <label>Hoy</label>

        <label class="today-pill">
          <input type="checkbox" id="todayOnly" />
          <span class="today-pill__ui">
            <span class="today-pill__text">HOY</span>

          </span>
        </label>
      </div>



      <div class="field">
        <label for="rarity">Rareza</label>
        <select id="rarity">
          <option value="">Todas</option>
          <option value="Common">Common</option>
          <option value="Rare">Rare</option>
          <option value="Epic">Epic</option>
          <option value="Exotic">Exotic</option>
          <option value="Legendary">Legendary</option>
        </select>
      </div>


      <div class="field">
        <label for="place">Lugar</label>
        <select id="place">
          <option value="">Todos</option>
          <option value="Forest">Forest</option>
          <option value="Mount Gemma">Mount Gemma</option>
          <option value="The Shac">The Shac</option>
          <option value="Mansion">Mansion</option>
          <option value="Beach">Beach</option>
          <option value="Moon of Miscria">Moon of Miscria</option>
          <option value="Cave">Cave</option>
        </select>
      </div>


      <div class="actions">
        <button id="btnClear" class="btn ghost">Limpiar</button>
        <button id="btnRandom" class="btn">Aleatorio</button>
      </div>
    </section>

    <section class="meta">
      <div id="count"></div>
    </section>

    <section id="results" class="grid"></section>

    <template id="miscritCard">
      <article class="miscrit card">
        <div class="miscrit__head">
          <div class="miscrit__left">
            <img class="miscrit__avatar" />
              <div>
                <h2 class="miscrit__name"></h2>
                <div class="miscrit__type"></div>
              </div>
          </div>
          <div class="badge"></div>
        </div>
        <div class="spawns"></div>
      </article>
    </template>
  </main>

  <footer class="footer">
    <section class="pager card" id="pager">
  		<button class="btn ghost" id="btnPrev">Anterior</button>

  		<div class="pager__mid">
    		<span id="pageInfo">Página 1 / 1</span>

    		<label class="pager__label">
      		Por página
      		<select id="pageSize">
						<option value="24">24</option>
						<option value="36" selected>36</option>
						<option value="48">48</option>
						<option value="72">72</option>
      		</select>
    		</label>
  		</div>
			<button class="btn" id="btnNext">Siguiente</button>
		</section>
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
