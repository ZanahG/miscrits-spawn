<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Miscripedia | Miscrits Hub</title>

  <link rel="stylesheet" href="../styles/miscripedia.css" />

  <link rel="icon" href="../assets/images/logo.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/images/logo.png">
</head>
<body>
  <div class="wrap">
    <header class="top">

      <!-- LOGO HUB -->
      <a href="../index.html" class="brandLogo" aria-label="Back to Miscrits Hub">
        <img src="../assets/images/logo.png" alt="Miscrits Hub">
      </a>

      <h1 class="brand">Miscripedia</h1>

      <div class="searchRow">
        <div class="search">
          <span class="ico">🔎</span>
          <input id="q" type="search" placeholder="Search Miscrits..." autocomplete="off"/>
        </div>
      </div>

      <div class="searchRow">
        <div class="miscritpicker miscritpicker--md">
          <div class="search search--full">
            <span class="ico">⚔️</span>
            <input
              id="attackFilter"
              type="text"
              placeholder="Filter by attack name..."
              autocomplete="off"
            />
          </div>

          <div id="attackDropdown" class="miscritpicker__dropdown" hidden></div>
        </div>
      </div>

      <div class="filtersRow">
        <select id="rarity">
          <option value="">All Rarities</option>
        </select>

        <select id="sort">
          <option value="nameAsc">Sort: Name (A→Z)</option>
          <option value="nameDesc">Sort: Name (Z→A)</option>
          <option value="idAsc">Sort: ID (↑)</option>
          <option value="idDesc">Sort: ID (↓)</option>
        </select>

        <select id="tag">
          <option value="">Filter by Tags</option>
        </select>

        <!-- Stats filter (dropdown) -->
        <div class="statsFilter" id="statsFilter">
          <button class="statsBtn" id="statsBtn" type="button" aria-expanded="false">
            Stats <span class="statsBtn__chev">▾</span>
          </button>

          <div class="statsPanel" id="statsPanel" hidden>
            <div class="statsPanel__head">
              <div class="statsPanel__title">Filter by Stats</div>
              <button class="statsClear" id="statsClear" type="button">Clear</button>
            </div>

            <div class="statsPanel__grid" id="statsGrid"></div>
          </div>
        </div>

      </div>

      <div class="pills" id="elementsPills"></div>
    </header>

    <main>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden">No results.</div>
    </main>
  </div>

  <script src="../js/miscripedia.js"></script>
</body>
</html>
