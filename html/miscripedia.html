<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Miscripedia | Miscrits Hub</title>

  <link rel="stylesheet" href="../styles/miscripedia.css" />

  <link rel="icon" href="../assets/images/logo.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/images/logo.png">
</head>
<body>

  <!-- NAVBAR GLOBAL -->
  <header class="siteHeader">
    <div class="wrap siteHeader__inner">
      <a class="brand" href="../index.html" aria-label="Ir a Miscrits Hub">
        <img src="../assets/images/logo.png" alt="Miscrits Hub" class="brand__logo" draggable="false"/>
      </a>

      <button
        class="navToggle"
        id="navToggle"
        type="button"
        aria-label="Abrir menú"
        aria-controls="mainNav"
        aria-expanded="false"
      >
        <img class="navToggle__icon" src="../assets/images/icons/menu.png" alt="">
      </button>

      <nav id="mainNav" class="siteNav" aria-label="Navegación principal">
        <a class="siteNav__link" href="../index.html">Spawns</a>
        <a class="siteNav__link is-active" href="./miscripedia.html">Miscripedia</a>
        <a class="siteNav__link" href="./breeding.html">Breeding Calculator</a>
        <a class="siteNav__link" href="./statscalculator.html">Stats Calculator</a>
        <a class="siteNav__link" href="./pvp.html">PVP Teams</a>
        <a class="siteNav__link" href="./teambuilder.html">Team Builder</a>
        <a class="siteNav__link" href="./damage.html">Damage Calculator</a>
        <a class="siteNav__link" href="./miscritdle.html">Miscritdle</a>
        <a class="siteNav__link" href="./patchs.html">Patch Notes</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <header class="top">

      <div class="searchRow">
        <div class="search">
          <span class="ico">🔎</span>
          <input id="q" type="search" placeholder="Search Miscrits..." autocomplete="off"/>
        </div>
      </div>

      <div class="searchRow">
        <div class="miscritpicker miscritpicker--md">
          <div class="search search--full">
            <span class="ico">⚔️</span>
            <input
              id="attackFilter"
              type="text"
              placeholder="Filter by attack name..."
              autocomplete="off"
            />
          </div>

          <div id="attackDropdown" class="miscritpicker__dropdown" hidden></div>
        </div>
      </div>

      <div class="filtersRow">
        <select id="rarity">
          <option value="">All Rarities</option>
        </select>

        <select id="sort">
          <option value="nameAsc">Sort: Name (A→Z)</option>
          <option value="nameDesc">Sort: Name (Z→A)</option>
          <option value="idAsc">Sort: ID (↑)</option>
          <option value="idDesc">Sort: ID (↓)</option>
        </select>

        <select id="tag">
          <option value="">Filter by Tags</option>
        </select>

        <!-- Stats filter (dropdown) -->
        <div class="statsFilter" id="statsFilter">
          <button class="statsBtn" id="statsBtn" type="button" aria-expanded="false">
            Stats <span class="statsBtn__chev">▾</span>
          </button>

          <div class="statsPanel" id="statsPanel" hidden>
            <div class="statsPanel__head">
              <div class="statsPanel__title">Filter by Stats</div>
              <button class="statsClear" id="statsClear" type="button">Clear</button>
            </div>

            <div class="statsPanel__grid" id="statsGrid"></div>
          </div>
        </div>

      </div>

      <div class="pills" id="elementsPills"></div>
    </header>

    <main>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden">No results.</div>
    </main>
  </div>

  <script src="../js/gtm.js"></script>
  <script src="../js/nav.js" defer></script>
  <script src="../js/miscripedia.js"></script>
</body>
</html>
