<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Miscrits Team Builder</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../styles/teambuilder.css" />
</head>
<body>

  <header class="top">
    <div class="wrap topbar">
      <a class="brand" href="../index.html">
        <img src="../assets/images/logo.png" class="brand__logo" alt="Miscrits Hub" draggable="false" />
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="sc__bonusRow">
        <p class="sc__bonusTitle">TEAM BUILDER</p>
        <div id="tbPoints" class="tb__points">0 / 12</div>
      </div>

      <div class="tb__slots" id="tbSlots"></div>

      <div class="tb__panel" id="tbPanel">
        <div class="tb__panelGrid">

          <!-- LEFT -->
          <div class="tb__panelLeft">

            <div class="tb__analysisBlock">
              <div class="tb__analysisTitle">Biggest threats</div>
              <div class="tb__problemsRow" id="tbThreats">
                <div class="tb__muted">—</div>
              </div>
            </div>

            <div class="tb__analysisBlock">
              <div class="tb__analysisTitle">Element coverage</div>
              <div class="tb__elemGrid" id="tbCoverage"></div>
            </div>

          </div>

          <!-- RIGHT -->
          <div class="tb__panelRight">
            <div class="tb__analysisBlock">
              <div class="tb__analysisTitle">Hard counters</div>

              <!-- CLAVE: usar tb__countersRow para que el CSS flex aplique -->
              <div id="tbCounters" class="tb__countersRow">
                <div class="tb__muted">—</div>
              </div>
            </div>
          </div>

          <!-- BOTTOM (full width) -->
          <div class="tb__panelBottom">
            <div class="tb__analysisBlock">
              <div class="tb__analysisTitle">Suggested swaps</div>
              <div id="tbSwaps" class="tb__swapsRow">
                <div class="tb__muted">—</div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- TEMPLATES -->
      <template id="tplElemCard">
        <div class="tb__elemCard">
          <div class="tb__elemTop">
            <img class="tb__elemIcon" alt="">
            <div class="tb__elemName"></div>
          </div>
          <div class="tb__elemStats">
            <div class="tb__mini tb__mini--cov">
              <span>Coverage</span>
              <b class="covVal"></b>
            </div>
            <div class="tb__mini tb__mini--wk">
              <span>Weak</span>
              <b class="wkVal"></b>
            </div>
          </div>
        </div>
      </template>

      <template id="tplThreat">
        <div class="tb__problem">
          <img alt="">
          <span></span>
          <b></b>
        </div>
      </template>

    </section>
  </main>

  <!-- SLOT TEMPLATE -->
  <template id="tplTbSlot">
    <div class="tb__slot">
      <div class="tb__slotHead"></div>

      <div class="miscritpicker miscritpicker--md tb__picker">
        <div class="tb__picked" hidden>
          <img class="tb__pickedImg" alt="">
        </div>

        <input
          class="dmgx__search tb__input"
          type="text"
          autocomplete="off"
          placeholder="Write a Miscrit name"
        />

        <div class="miscritpicker__dropdown tb__dd" hidden></div>
      </div>
    </div>
  </template>

  <!-- DROPDOWN ITEM TEMPLATE -->
  <template id="tplTbDdItem">
    <button type="button" class="miscritpicker__item">
      <img class="miscritpicker__avatar" alt="">
      <div class="miscritpicker__name"></div>
      <div class="tb__ddMeta"></div>
    </button>
  </template>

  <!-- COUNTER CARD TEMPLATE -->
  <template id="tplCounter">
    <div class="tb__counterCard">
      <img class="tb__counterAvatar" alt="">
      <div class="tb__counterBody">
        <div class="tb__counterTop">
          <div class="tb__counterName"></div>
          <div class="tb__counterHTK"></div>
        </div>

        <div class="tb__counterMeta">
          <span class="tb__counterVs"></span>
        </div>

        <div class="tb__counterMoveRow">
          <img class="tb__counterMoveIcon" alt="">
          <span class="tb__counterMoveName"></span>
          <span class="tb__counterMul"></span>
        </div>

        <div class="tb__counterDbg">
          <span class="tb__counterAvg"></span>
        </div>
      </div>
    </div>
  </template>

  <!-- SWAP CARD TEMPLATE -->
  <template id="tplSwap">
    <div class="tb__swapCard">
      <div class="tb__swapSlot"></div>

      <div class="tb__swapRow">
        <div class="tb__swapSide">
          <img class="tb__swapAvatarOut" alt="">
          <div class="tb__swapNameOut"></div>
        </div>

        <div class="tb__swapArrow">→</div>

        <div class="tb__swapSide">
          <img class="tb__swapAvatarIn" alt="">
          <div class="tb__swapNameIn"></div>
        </div>
      </div>

      <div class="tb__swapDelta"></div>
    </div>
  </template>

  <template id="tplMuted">
    <div class="tb__muted">—</div>
  </template>

  <script type="module" src="../js/team_builder.js"></script>
</body>
</html>
