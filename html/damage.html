<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Damage Calculator</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" href="../assets/images/logo.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/images/logo.png">
</head>
<body>
  <header class="top">
    <div class="wrap topbar">
      <a class="brand" href="../index.html" aria-label="Ir a Miscrits Hub">
        <img src="../assets/images/logo.png" alt="Miscrits Hub" class="brand__logo" draggable="false" />
      </a>

      <nav class="topnav topnav--header" aria-label="Navegación principal">
        <a class="topnav__link" href="../index.html">Spawns</a>
        <a class="topnav__link" href="../html/pvp.html">PVP Teams</a>
        <a class="topnav__link is-active" href="../html/damage.html">Damage</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="card" style="padding:14px; margin-top:14px;">
      <div class="filters" style="grid-template-columns: 1fr 1fr; align-items:start;">
        <div class="card" style="padding:14px;">
          <div class="pvp__panelHead">
            <div class="pvp__panelTitle">Attacker</div>
            <div class="pvp__panelMeta" id="atkMeta">—</div>
          </div>

					<div class="field">
					<label for="atkMiscritSearch">Miscrit</label>
					<input id="atkMiscritSearch" list="miscritsList" placeholder="Escribe nombre o ID..." />
					<datalist id="miscritsList"></datalist>
					<input id="atkMiscrit" type="hidden" />
					</div>


          <div class="field">
            <label for="atkAttack">Attack</label>
            <select id="atkAttack"></select>
          </div>

          <div class="filters" style="grid-template-columns: repeat(3, 1fr); padding:0; margin-top:10px;">
            <div class="field"><label for="atkPA">PA</label><input id="atkPA" type="number" min="0" /></div>
            <div class="field"><label for="atkEA">EA</label><input id="atkEA" type="number" min="0" /></div>
            <div class="field"><label for="atkSPD">SPD</label><input id="atkSPD" type="number" min="0" /></div>
            <div class="field"><label for="atkPD">PD</label><input id="atkPD" type="number" min="0" /></div>
            <div class="field"><label for="atkED">ED</label><input id="atkED" type="number" min="0" /></div>
            <div class="field"><label for="atkHP">HP</label><input id="atkHP" type="number" min="0" /></div>
          </div>

          <div class="field" style="margin-top:10px;">
						<label>Relics (aplican bonus a stats)</label>

						<div class="relic-slots" id="atkRelicSlots">
							<button class="relic-slot" type="button" data-side="atk" data-slot="0"></button>
							<button class="relic-slot" type="button" data-side="atk" data-slot="1"></button>
							<button class="relic-slot" type="button" data-side="atk" data-slot="2"></button>
							<button class="relic-slot" type="button" data-side="atk" data-slot="3"></button>
						</div>

						<div style="display:none">
							<select class="atkRelic" data-slot="0"></select>
							<select class="atkRelic" data-slot="1"></select>
							<select class="atkRelic" data-slot="2"></select>
							<select class="atkRelic" data-slot="3"></select>
						</div>
					</div>


          <div class="filters" style="grid-template-columns: 1fr 1fr; padding:0; margin-top:10px;">
            <div class="field">
              <label for="atkRelicLvl">Relic level</label>
              <select id="atkRelicLvl">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="35" selected>35</option>
              </select>
            </div>
            <div class="field">
              <label for="atkMode">Attack stat</label>
              <select id="atkMode">
                <option value="auto" selected>Auto (según elemento)</option>
                <option value="physical">Physical (PA vs PD)</option>
                <option value="elemental">Elemental (EA vs ED)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card" style="padding:14px;">
          <div class="pvp__panelHead">
            <div class="pvp__panelTitle">Defender</div>
            <div class="pvp__panelMeta" id="defMeta">—</div>
          </div>

          <div class="field">
						<label for="defMiscritSearch">Miscrit</label>
						<input id="defMiscritSearch" list="miscritsList" placeholder="Escribe nombre o ID..." />
						<input id="defMiscrit" type="hidden" />
					</div>


          <div class="filters" style="grid-template-columns: repeat(3, 1fr); padding:0; margin-top:10px;">
            <div class="field"><label for="defPA">PA</label><input id="defPA" type="number" min="0" /></div>
            <div class="field"><label for="defEA">EA</label><input id="defEA" type="number" min="0" /></div>
            <div class="field"><label for="defSPD">SPD</label><input id="defSPD" type="number" min="0" /></div>
            <div class="field"><label for="defPD">PD</label><input id="defPD" type="number" min="0" /></div>
            <div class="field"><label for="defED">ED</label><input id="defED" type="number" min="0" /></div>
            <div class="field"><label for="defHP">HP</label><input id="defHP" type="number" min="0" /></div>
          </div>

          <div class="field" style="margin-top:10px;">
						<label>Relics</label>

						<div class="relic-slots" id="defRelicSlots">
							<button class="relic-slot" type="button" data-side="def" data-slot="0"></button>
							<button class="relic-slot" type="button" data-side="def" data-slot="1"></button>
							<button class="relic-slot" type="button" data-side="def" data-slot="2"></button>
							<button class="relic-slot" type="button" data-side="def" data-slot="3"></button>
						</div>

						<div style="display:none">
							<select class="defRelic" data-slot="0"></select>
							<select class="defRelic" data-slot="1"></select>
							<select class="defRelic" data-slot="2"></select>
							<select class="defRelic" data-slot="3"></select>
						</div>
					</div>


          <div class="field" style="margin-top:10px;">
            <label for="defRelicLvl">Relic level</label>
            <select id="defRelicLvl">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="35" selected>35</option>
            </select>
          </div>

          <div class="card" style="padding:14px; margin-top:14px;">
            <div class="pvp__panelTitle" style="font-size:16px;">Result</div>
            <div class="pvp__panelMeta" id="resultMeta">—</div>
            <div id="resultBox" style="margin-top:10px; color:var(--text); font-weight:800;"></div>
            <div id="resultNotes" style="margin-top:8px; color:var(--muted); font-size:12px;"></div>
          </div>
        </div>
      </div>
    </section>
		<div class="relic-modal" id="relicModal" hidden>
			<div class="relic-modal__overlay" data-action="close-relic"></div>

			<div class="relic-modal__card">
				<div class="relic-modal__head">
					<div class="relic-modal__title" id="relicModalTitle">Relics</div>
					<button class="btn ghost" type="button" data-action="close-relic">Cerrar</button>
				</div>

				<div class="relic-modal__search">
					<input id="relicSearch" type="text" placeholder="Buscar relic..." />
				</div>

				<div class="relic-modal__grid" id="relicGrid"></div>
			</div>
		</div>

  </main>

  <script src="../js/damage.js"></script>
</body>
</html>
